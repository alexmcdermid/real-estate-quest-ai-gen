name: Dry Run (test only)

on:
  workflow_dispatch:
    inputs:
      chapter_override:
        description: "Chapter number to generate for (1-20). Leave blank to use the weekly rotation."
        required: false
        type: string

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate question (dry run — no Firestore write)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_PAT: ${{ secrets.QUESTIONS_REPO_PAT }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CHAPTER_OVERRIDE: ${{ inputs.chapter_override }}
          DRY_RUN: "true"
        run: node src/index.js
